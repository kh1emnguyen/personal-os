/* ─── HELPERS ───────────────────────────────────────────────────── */
function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch { return {}; } }
function save(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }
const STEPS = [0,25,50,75,100];
const ALL_TRACKABLE = [...SKILLS, ...AGENTS, ...APPS];
function pctColor(p) { return p===100?'#4ade80':p>0?'#fbbf24':'#334155'; }
function pctBg(p) { return p===100?'linear-gradient(90deg,#4ade80,#22d3ee)':p>0?'linear-gradient(90deg,#f59e0b,#fbbf24)':'#1a3050'; }

/* ─── PROGRESS CONTROL ──────────────────────────────────────────── */
function PCtrl({ id, pct, onSet, small }) {
  const idx = STEPS.indexOf(pct);
  const sz = small ? 16 : 18;
  const Btn = ({ dir }) => {
    const disabled = dir==='−'?pct===0:pct===100;
    const next = dir==='−'?STEPS[Math.max(0,idx-1)]:STEPS[Math.min(4,idx+1)];
    return <button onClick={()=>!disabled&&onSet(id,next)} style={{
      width:sz,height:sz,borderRadius:4,border:'none',cursor:disabled?'default':'pointer',
      background:disabled?'transparent':dir==='+'?'rgba(74,222,128,.15)':'rgba(255,255,255,.06)',
      color:disabled?'#1a3050':dir==='+'?'#4ade80':'#64748b',
      fontSize:small?11:13,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',padding:0,
    }}>{dir}</button>;
  };
  return (
    <div style={{display:'flex',alignItems:'center',gap:4}}>
      <Btn dir="−"/>
      <div style={{flex:1,height:small?2:3,borderRadius:2,background:'#0d2040',overflow:'hidden'}}>
        <div style={{height:'100%',width:`${pct}%`,background:pctBg(pct),transition:'width .3s'}}/>
      </div>
      <span style={{fontSize:small?9:10,fontWeight:700,color:pctColor(pct),minWidth:24,textAlign:'right'}}>{pct}%</span>
      <Btn dir="+"/>
    </div>
  );
}

/* ─── FLOWCHART VIEW ─────────────────────────────────────────────
   (condensed from previous version)
──────────────────────────────────────────────────────────────────── */
function FlowchartView({ progress, onSet }) {
  const morningAgents = AGENTS.filter(a=>a.fleet==='morning');
  const sideAgents = AGENTS.filter(a=>a.fleet!=='morning');

  const Card = ({ item, color, nameSize=11, fnText }) => {
    const pct = progress[item.id]??0;
    return (
      <div style={{background:'rgba(255,255,255,.02)',border:`1px solid ${pct===100?'rgba(74,222,128,.25)':'rgba(255,255,255,.05)'}`,
        borderLeft:`3px solid ${color||item.color||item.groupColor||'#334155'}`,borderRadius:7,padding:'8px 10px',
        display:'flex',flexDirection:'column',gap:6}}>
        <div style={{fontSize:nameSize,fontWeight:600,color:pct===100?'#86efac':'#b0bfcf'}}>{pct===100&&'✅ '}{item.name}</div>
        {fnText && <p style={{fontSize:9,color:'#3d5470',lineHeight:1.4}}>{item.fn||item.desc||item.trigger}</p>}
        <PCtrl id={item.id} pct={pct} onSet={onSet} small />
      </div>
    );
  };

  const SectionBox = ({ title, sub, color, items }) => {
    const avg = Math.round(items.reduce((s,a)=>s+(progress[a.id]??0),0)/items.length);
    return (
      <div style={{background:'rgba(255,255,255,.015)',border:`1px solid rgba(255,255,255,.06)`,borderTop:`2px solid ${color}`,borderRadius:10,padding:'12px',display:'flex',flexDirection:'column',gap:7}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><span style={{fontSize:11,fontWeight:700,color}}>{title}</span><span style={{fontSize:9,color:'#334155',marginLeft:6}}>{sub}</span></div>
          <span style={{fontSize:10,fontWeight:700,color:pctColor(avg),background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)',borderRadius:20,padding:'2px 7px'}}>{avg}%</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {items.map(a=><Card key={a.id} item={a} color={a.color} fnText />)}
        </div>
      </div>
    );
  };

  const PhaseDivider = ({ label }) => (
    <div style={{display:'flex',alignItems:'center',gap:6,margin:'3px 0'}}>
      <div style={{flex:1,height:1,background:'#1a3050'}}/>
      <span style={{fontSize:8,color:'#1e3a5f',letterSpacing:'.06em',whiteSpace:'nowrap'}}>{label} ↓</span>
      <div style={{flex:1,height:1,background:'#1a3050'}}/>
    </div>
  );

  const Arrow = ({ label }) => (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'3px 0'}}>
      <div style={{width:1,height:10,background:'#1a3050'}}/>
      <span style={{fontSize:8,color:'#263d5a',letterSpacing:'.06em'}}>{label} ▼</span>
    </div>
  );

  const morningAvg = Math.round(morningAgents.reduce((s,a)=>s+(progress[a.id]??0),0)/morningAgents.length);

  return (
    <div style={{display:'flex',flexDirection:'column',gap:0,overflow:'auto',maxHeight:'calc(100vh - 130px)',padding:'16px 20px'}}>
      {/* Inputs */}
      <div style={{background:'rgba(255,255,255,.01)',border:'1px solid rgba(255,255,255,.05)',borderRadius:10,padding:'12px',marginBottom:4}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',color:'#334155',marginBottom:8}}>📥 DATA SOURCES</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:6}}>
          {INPUTS.map(n=>(
            <div key={n.id} style={{background:'rgba(255,255,255,.025)',border:`1px solid rgba(255,255,255,.06)`,borderTop:`2px solid ${n.color}`,borderRadius:7,padding:'8px 10px'}}>
              <div style={{fontSize:11,fontWeight:600,color:'#94a3b8'}}>{n.emoji} {n.name}</div>
              <div style={{fontSize:9,color:'#263d5a',marginTop:2}}>{n.desc}</div>
            </div>
          ))}
        </div>
      </div>
      <Arrow label="feeds into" />
      {/* Skills */}
      <div style={{background:'rgba(255,255,255,.01)',border:'1px solid rgba(255,255,255,.05)',borderRadius:10,padding:'12px',marginBottom:4}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',color:'#334155',marginBottom:8}}>📖 SKILLS LAYER</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {SKILL_GROUPS.map(g=>{
            const avg=Math.round(g.items.reduce((s,i)=>s+(progress[i.id]??0),0)/g.items.length);
            return (
              <div key={g.id} style={{background:'rgba(255,255,255,.015)',border:'1px solid rgba(255,255,255,.05)',borderTop:`2px solid ${g.color}`,borderRadius:9,padding:'10px',display:'flex',flexDirection:'column',gap:6}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:11,fontWeight:700,color:g.color}}>{g.label}</span>
                  <span style={{fontSize:9,fontWeight:700,color:pctColor(avg)}}>{avg}%</span>
                </div>
                {g.items.map(sk=><Card key={sk.id} item={sk} color={g.color} />)}
              </div>
            );
          })}
        </div>
      </div>
      <Arrow label="inform agents" />
      {/* Agents */}
      <div style={{background:'rgba(255,255,255,.01)',border:'1px solid rgba(255,255,255,.05)',borderRadius:10,padding:'12px',marginBottom:4}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',color:'#334155',marginBottom:8}}>🤖 AGENT FLEET</div>
        <div style={{display:'grid',gridTemplateColumns:'3fr 2fr',gap:12}}>
          {/* Morning fleet */}
          <div style={{background:'rgba(74,222,128,.03)',border:'1px solid rgba(74,222,128,.12)',borderTop:'2px solid #4ade80',borderRadius:10,padding:'12px',display:'flex',flexDirection:'column',gap:6}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:11,fontWeight:700,color:'#4ade80'}}>Morning Fleet</span>
              <span style={{fontSize:9,fontWeight:700,color:pctColor(morningAvg)}}>{morningAvg}%</span>
            </div>
            {morningAgents.filter(a=>a.phase==='conductor').map(a=><Card key={a.id} item={a} color={a.color} fnText />)}
            <PhaseDivider label="PHASE A — parallel" />
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
              {morningAgents.filter(a=>a.phase==='A').map(a=><Card key={a.id} item={a} color={a.color} />)}
            </div>
            <PhaseDivider label="PHASE B — after A" />
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:5}}>
              {morningAgents.filter(a=>a.phase==='B').map(a=><Card key={a.id} item={a} color={a.color} />)}
            </div>
            <PhaseDivider label="PHASE C — synthesis" />
            {morningAgents.filter(a=>a.phase==='C').map(a=><Card key={a.id} item={a} color={a.color} fnText />)}
          </div>
          {/* Side fleets */}
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {[
              {title:'Sunday Fleet',sub:'Weekly 9pm',color:'#a78bfa',items:sideAgents.filter(a=>a.fleet==='sunday')},
              {title:'Standalone Autonomous',sub:'Background',color:'#38bdf8',items:sideAgents.filter(a=>a.fleet==='standalone'&&a.phase==='auto')},
              {title:'On-Demand',sub:'Manual',color:'#fb923c',items:sideAgents.filter(a=>a.phase==='manual')},
            ].map(s=><SectionBox key={s.title} {...s} />)}
          </div>
        </div>
      </div>
      <Arrow label="write to" />
      {/* Apps */}
      <div style={{background:'rgba(255,255,255,.01)',border:'1px solid rgba(255,255,255,.05)',borderRadius:10,padding:'12px'}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.08em',color:'#334155',marginBottom:8}}>🚀 APPS & OUTPUTS</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:8}}>
          {APPS.map(a=>{
            const pct=progress[a.id]??0;
            return (
              <div key={a.id} style={{background:'rgba(255,255,255,.025)',border:`1px solid ${pct===100?'rgba(74,222,128,.3)':'rgba(255,255,255,.06)'}`,borderTop:`2px solid ${a.color}`,borderRadius:8,padding:'10px 12px',display:'flex',flexDirection:'column',gap:7}}>
                <div style={{fontSize:12,fontWeight:700,color:pct===100?'#86efac':'#c8d5e8'}}>{pct===100&&'✅ '}{a.name}</div>
                <p style={{fontSize:9,color:'#3d5470'}}>{a.desc}</p>
                <PCtrl id={a.id} pct={pct} onSet={onSet} small />
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const ALL_NODES = [
  ...INPUTS.map(n=>({...n, type:'source', trackable:false})),
  ...SKILLS.map(s=>({...s, color:s.groupColor, type:'skill', trackable:true})),
  ...AGENTS.map(a=>({...a, type:'agent', trackable:true})),
  ...APPS.map(a=>({...a, type:'app', trackable:true})),
];

function nodeRadius(n) {
  if (n.isOrch) return 28;
  if (n.type==='source') return 20;
  if (n.type==='app') return 22;
  return 18;
}

function runForce(nodes, links, W, H, iterations=700) {
  // Spread initial positions evenly across the full canvas
  const layerCounts = {};
  nodes.forEach(n => { layerCounts[n.layer] = (layerCounts[n.layer]||0)+1; });
  const seen = {};
  nodes.forEach(n => {
    seen[n.layer] = seen[n.layer]||0;
    n.x = (W * 0.05) + (W * 0.9) * (seen[n.layer]+0.5) / layerCounts[n.layer];
    n.y = (H * 0.06) + (H * 0.88) * n.layer / 3;
    seen[n.layer]++;
    n.vx = 0; n.vy = 0;
  });

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  for (let iter = 0; iter < iterations; iter++) {
    const alpha = Math.pow(1 - iter/iterations, 0.6); // slower cool-down = more spread
    // Strong repulsion — no distance cap so distant nodes still push apart
    for (let i=0;i<nodes.length;i++) {
      for (let j=i+1;j<nodes.length;j++) {
        const a=nodes[i],b=nodes[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const d=Math.sqrt(dx*dx+dy*dy)||0.01;
        const f = Math.min(14000/(d*d), 80) * alpha;
        a.vx-=f*dx/d; a.vy-=f*dy/d;
        b.vx+=f*dx/d; b.vy+=f*dy/d;
      }
    }
    // Link spring — longer ideal distances so linked nodes stay readable
    links.forEach(([sid,tid]) => {
      const s=nodeMap[sid],t=nodeMap[tid];
      if(!s||!t)return;
      const dx=t.x-s.x, dy=t.y-s.y;
      const d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const ideal = 220 + Math.abs(s.layer-t.layer)*80;
      const f=(d-ideal)*0.025*alpha;
      s.vx+=f*dx/d; s.vy+=f*dy/d;
      t.vx-=f*dx/d; t.vy-=f*dy/d;
    });
    // Gentle layer gravity — enough to band by layer, not enough to cluster
    nodes.forEach(n => {
      const targetY = (H*0.06)+(H*0.88)*n.layer/3;
      n.vy += (targetY - n.y) * 0.008 * alpha;
      n.vx += (W/2 - n.x) * 0.0003;
    });
    // Integrate with low damping so momentum carries nodes further
    nodes.forEach(n => {
      n.vx*=0.82; n.vy*=0.82;
      n.x=Math.max(60,Math.min(W-60,n.x+n.vx));
      n.y=Math.max(60,Math.min(H-60,n.y+n.vy));
    });
  }
  return nodes;
}

function computeFit(positions, svgW, svgH, pad=80) {
  const xs=Object.values(positions).map(p=>p.x);
  const ys=Object.values(positions).map(p=>p.y);
  const minX=Math.min(...xs)-pad, maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad, maxY=Math.max(...ys)+pad;
  const s=Math.min(svgW/(maxX-minX), svgH/(maxY-minY), 1);
  return { x:(svgW-(maxX-minX)*s)/2-minX*s, y:(svgH-(maxY-minY)*s)/2-minY*s, s };
}

function NetworkView({ progress, onSet }) {
  const svgRef = useRef(null);
  const containerRef = useRef(null);
  const [size, setSize] = useState({w:1200,h:800});
  const [selected, setSelected] = useState(null);
  const [positions, setPositions] = useState(null);
  const [dragging, setDragging] = useState(null);   // node drag
  const [panning, setPanning] = useState(null);      // viewport pan
  const [hoveredNode, setHoveredNode] = useState(null);
  const [vp, setVp] = useState({x:0,y:0,s:1});      // viewport: offset + scale
  const [fitVp, setFitVp] = useState({x:0,y:0,s:1}); // saved fit-to-all view

  // Resize observer
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const update = () => setSize({w:el.clientWidth,h:el.clientHeight});
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return ()=>ro.disconnect();
  },[]);

  // Force layout — run on 4× canvas so nodes have room to spread, then fit viewport
  useEffect(() => {
    if (!size.w) return;
    const svgH = size.h - 80;
    const nodes = ALL_NODES.map(n=>({...n}));
    runForce(nodes, EDGES, size.w * 4, svgH * 3, 700);
    const pos = {};
    nodes.forEach(n=>{ pos[n.id]={x:n.x,y:n.y}; });
    setPositions(pos);
    const fit = computeFit(pos, size.w, svgH);
    setVp(fit);
    setFitVp(fit);
  },[size.w]);

  // Non-passive wheel listener (required so preventDefault works)
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return;
    function onWheel(e) {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY > 0 ? 0.88 : 1.14;
      setVp(v => {
        const ns = Math.min(4, Math.max(0.15, v.s * factor));
        return { x: mx - (mx - v.x)*(ns/v.s), y: my - (my - v.y)*(ns/v.s), s: ns };
      });
    }
    svg.addEventListener('wheel', onWheel, {passive:false});
    return () => svg.removeEventListener('wheel', onWheel);
  }, []);

  // Arrow keys (pan) + +/- (zoom) + 0 (reset)
  useEffect(() => {
    function onKey(e) {
      const step = 50;
      if      (e.key==='ArrowLeft')            { e.preventDefault(); setVp(v=>({...v,x:v.x+step})); }
      else if (e.key==='ArrowRight')           { e.preventDefault(); setVp(v=>({...v,x:v.x-step})); }
      else if (e.key==='ArrowUp')              { e.preventDefault(); setVp(v=>({...v,y:v.y+step})); }
      else if (e.key==='ArrowDown')            { e.preventDefault(); setVp(v=>({...v,y:v.y-step})); }
      else if (e.key==='='||e.key==='+')       setVp(v=>({...v,s:Math.min(4,v.s*1.2)}));
      else if (e.key==='-')                    setVp(v=>({...v,s:Math.max(0.15,v.s/1.2)}));
      else if (e.key==='0')                    setVp(fitVp);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [fitVp]);

  const nodeMap = useMemo(()=>{const m={};ALL_NODES.forEach(n=>m[n.id]=n);return m;},[]);

  const connectedIds = useMemo(()=>{
    if (!hoveredNode) return null;
    const set = new Set([hoveredNode]);
    EDGES.forEach(([s,t])=>{ if(s===hoveredNode)set.add(t); if(t===hoveredNode)set.add(s); });
    return set;
  },[hoveredNode]);

  function predecessorsComplete(nodeId) {
    return EDGES.filter(([,t])=>t===nodeId).map(([s])=>s).every(p=>{
      const n=nodeMap[p]; if(!n||!n.trackable)return true; return (progress[p]??0)===100;
    });
  }

  // Node mousedown: start node drag, stop propagation so SVG pan doesn't fire
  function handleNodeMouseDown(e, nodeId) {
    e.preventDefault();
    e.stopPropagation();
    setDragging({ id: nodeId });
  }

  // SVG background mousedown: start viewport pan
  function handleSvgMouseDown(e) {
    setPanning({ sx: e.clientX, sy: e.clientY, vx: vp.x, vy: vp.y });
  }

  function handleMouseMove(e) {
    if (dragging) {
      const rect = svgRef.current.getBoundingClientRect();
      // Convert screen → canvas coords
      const cx = (e.clientX - rect.left - vp.x) / vp.s;
      const cy = (e.clientY - rect.top  - vp.y) / vp.s;
      setPositions(prev=>({...prev,[dragging.id]:{x:cx,y:cy}}));
    } else if (panning) {
      setVp(v=>({...v, x: panning.vx+(e.clientX-panning.sx), y: panning.vy+(e.clientY-panning.sy) }));
    }
  }

  function handleMouseUp() { setDragging(null); setPanning(null); }

  if (!positions) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'#334155',fontSize:13}}>Calculating layout…</div>;

  const selNode = selected ? nodeMap[selected] : null;
  const selPct  = selected ? (progress[selected]??0) : 0;
  const svgH    = size.h - 80;

  function edgePath(sx,sy,tx,ty) {
    const mx=(sx+tx)/2, my=(sy+ty)/2, dx=tx-sx, dy=ty-sy, d=Math.sqrt(dx*dx+dy*dy)||1;
    return `M${sx},${sy} Q${mx-dy*.25},${my+dx*.25} ${tx},${ty}`;
  }

  const zBtn = extra => ({
    width:30,height:30,borderRadius:7,border:'1px solid rgba(255,255,255,.13)',
    background:'rgba(10,22,40,.9)',color:'#94a3b8',cursor:'pointer',
    fontSize:16,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',
    backdropFilter:'blur(4px)', ...extra,
  });

  return (
    <div style={{display:'flex',height:'calc(100vh - 130px)',overflow:'hidden'}}>
      {/* SVG canvas */}
      <div ref={containerRef} style={{flex:1,position:'relative',overflow:'hidden'}}>
        <svg ref={svgRef} width={size.w} height={svgH}
          onMouseDown={handleSvgMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
          style={{display:'block',cursor:dragging?'grabbing':panning?'grabbing':'grab',userSelect:'none'}}>
          <defs>
            <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
              <polygon points="0 0, 7 3.5, 0 7" fill="rgba(255,255,255,0.15)" />
            </marker>
          </defs>

          {/* Everything inside the viewport transform */}
          <g transform={`translate(${vp.x},${vp.y}) scale(${vp.s})`}>

            {/* Layer bands */}
            {[{l:0,label:'DATA SOURCES'},{l:1,label:'SKILLS'},{l:2,label:'AGENTS'},{l:3,label:'APPS'}].map((band,i)=>{
              const bH=svgH*0.25;
              return (
                <g key={band.l}>
                  <rect x={0} y={Math.max(0,svgH*band.l/3-bH*.4)} width={size.w} height={bH*.85}
                    fill={`rgba(255,255,255,${[.008,.006,.01,.008][i]})`} />
                  <text x={8} y={svgH*band.l/3+12} fill="#1a3050" fontSize={8} fontWeight={700} letterSpacing={1.5}>{band.label}</text>
                </g>
              );
            })}

            {/* Edges */}
            {EDGES.map(([sid,tid],i)=>{
              const sp=positions[sid],tp=positions[tid];
              if(!sp||!tp)return null;
              const sn=nodeMap[sid],tn=nodeMap[tid],sr=nodeRadius(sn),tr=nodeRadius(tn);
              const dx=tp.x-sp.x,dy=tp.y-sp.y,d=Math.sqrt(dx*dx+dy*dy)||1;
              const sx=sp.x+(dx/d)*sr,sy=sp.y+(dy/d)*sr;
              const tx=tp.x-(dx/d)*(tr+6),ty=tp.y-(dy/d)*(tr+6);
              const hi=hoveredNode&&connectedIds.has(sid)&&connectedIds.has(tid);
              const dim=hoveredNode&&!hi;
              return <path key={i} d={edgePath(sx,sy,tx,ty)} fill="none"
                stroke={hi?'rgba(255,255,255,.5)':dim?'rgba(255,255,255,.03)':'rgba(255,255,255,.1)'}
                strokeWidth={hi?1.5:.8} markerEnd="url(#arr)"
                style={{transition:'stroke .2s,stroke-width .2s'}}/>;
            })}

            {/* Nodes */}
            {ALL_NODES.map(n=>{
              const pos=positions[n.id]; if(!pos)return null;
              const r=nodeRadius(n),pct=n.trackable?(progress[n.id]??0):100;
              const circ=2*Math.PI*r,dash=circ*(pct/100);
              const isSel=selected===n.id,isHov=hoveredNode===n.id;
              const isDim=hoveredNode&&!connectedIds.has(n.id)&&!isHov;
              const isBlk=n.trackable&&!predecessorsComplete(n.id)&&pct<100;
              const ring=pct===100?'#4ade80':pct>0?'#fbbf24':'#e94560';
              return (
                <g key={n.id} transform={`translate(${pos.x},${pos.y})`}
                  onMouseDown={e=>handleNodeMouseDown(e,n.id)}
                  onClick={()=>setSelected(selected===n.id?null:n.id)}
                  onMouseEnter={()=>setHoveredNode(n.id)}
                  onMouseLeave={()=>setHoveredNode(null)}
                  style={{cursor:'pointer',opacity:isDim?.2:1,transition:'opacity .15s'}}>
                  {isSel&&<circle r={r+6} fill="none" stroke={n.color} strokeWidth={1.5} opacity={.35}/>}
                  <circle r={r} fill={`rgba(${hexToRgb(n.color)||'100,100,100'},.12)`}
                    stroke={isSel?n.color:isHov?n.color:'rgba(255,255,255,.12)'}
                    strokeWidth={isSel?2:isHov?1.5:1}/>
                  {n.trackable&&<circle r={r} fill="none" stroke={ring} strokeWidth={2.5}
                    strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={circ/4}
                    strokeLinecap="round" opacity={.8}/>}
                  {isBlk&&<circle r={r+3} fill="none" stroke="#e94560" strokeWidth={1} strokeDasharray="3 3" opacity={.5}/>}
                  <text textAnchor="middle" dominantBaseline="middle" fontSize={n.type==='source'?11:9} fill={n.color} fontWeight={700}>
                    {n.type==='source'?n.emoji:n.name.substring(0,2).toUpperCase()}
                  </text>
                  <text textAnchor="middle" y={r+10} fontSize={8} fill={isSel||isHov?'#e8edf2':'#64748b'}
                    fontWeight={isSel?700:400} style={{transition:'fill .15s',pointerEvents:'none'}}>
                    {n.name.length>14?n.name.substring(0,13)+'…':n.name}
                  </text>
                  {n.trackable&&pct>0&&<text textAnchor="middle" y={r+19} fontSize={7} fill={ring} fontWeight={700}>{pct}%</text>}
                </g>
              );
            })}
          </g>
        </svg>

        {/* Zoom controls */}
        <div style={{position:'absolute',top:10,right:12,display:'flex',flexDirection:'column',gap:4,zIndex:10}}>
          <button style={zBtn()} onClick={()=>setVp(v=>({...v,s:Math.min(4,v.s*1.2)}))} title="Zoom in (+)">+</button>
          <button style={zBtn()} onClick={()=>setVp(v=>({...v,s:Math.max(0.15,v.s/1.2)}))} title="Zoom out (−)">−</button>
          <button style={zBtn({fontSize:14})} onClick={()=>setVp(fitVp)} title="Fit all nodes (0)">⌂</button>
          <div style={{fontSize:9,color:'#334155',textAlign:'center',marginTop:2}}>{Math.round(vp.s*100)}%</div>
        </div>

        {/* Legend */}
        <div style={{position:'absolute',bottom:8,left:12,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          {[['#64748b','Data Source'],['#a78bfa','Skill'],['#4ade80','Agent'],['#f97316','App']].map(([c,l])=>(
            <div key={l} style={{display:'flex',alignItems:'center',gap:4}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:c,opacity:.7}}/>
              <span style={{fontSize:9,color:'#334155'}}>{l}</span>
            </div>
          ))}
          <span style={{fontSize:9,color:'#263d5a',marginLeft:4}}>Drag canvas · Scroll or ±/arrows to zoom · Click to inspect</span>
        </div>
      </div>

      {/* Detail panel */}
      {selNode && (
        <div style={{width:260,background:'#0a1628',borderLeft:'1px solid rgba(255,255,255,.07)',padding:'16px',overflowY:'auto',display:'flex',flexDirection:'column',gap:12,animation:'fadeIn .15s ease'}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:selNode.color,marginBottom:4}}>{selNode.name}</div>
            <div style={{fontSize:9,color:'#334155',marginBottom:8,textTransform:'uppercase',letterSpacing:'.07em'}}>
              {selNode.type} · {selNode.layer===0?'Data Source':selNode.layer===1?selNode.groupLabel:selNode.fleet||''} {selNode.schedule&&`· ${selNode.schedule}`}
            </div>
            <p style={{fontSize:11,color:'#64748b',lineHeight:1.55}}>{selNode.desc||selNode.fn||selNode.trigger||''}</p>
          </div>
          {selNode.trackable&&(
            <div style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.08)',borderRadius:8,padding:'12px',display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:9,color:'#334155',fontWeight:700,letterSpacing:'.06em'}}>COMPLETION</div>
              <PCtrl id={selNode.id} pct={selPct} onSet={onSet} />
              {!predecessorsComplete(selNode.id)&&selPct<100&&(
                <div style={{fontSize:9,color:'#e94560',background:'rgba(233,69,96,.1)',border:'1px solid rgba(233,69,96,.2)',borderRadius:5,padding:'5px 8px'}}>
                  ⚠ Predecessors incomplete
                </div>
              )}
            </div>
          )}
          {(()=>{
            const preds=EDGES.filter(([,t])=>t===selNode.id).map(([s])=>nodeMap[s]).filter(Boolean);
            const succs=EDGES.filter(([s])=>s===selNode.id).map(([,t])=>nodeMap[t]).filter(Boolean);
            return (
              <>
                {preds.length>0&&(
                  <div>
                    <div style={{fontSize:9,color:'#334155',fontWeight:700,letterSpacing:'.06em',marginBottom:5}}>PREDECESSORS ({preds.length})</div>
                    {preds.map(p=>{ const pp=progress[p.id]??0; return (
                      <div key={p.id} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}>
                        <div style={{width:5,height:5,borderRadius:'50%',background:p.trackable?pctColor(pp):'#334155',flexShrink:0}}/>
                        <span style={{fontSize:10,color:'#94a3b8',flex:1}}>{p.name}</span>
                        {p.trackable&&<span style={{fontSize:9,color:pctColor(pp),fontWeight:700}}>{pp}%</span>}
                      </div>
                    );})}
                  </div>
                )}
                {succs.length>0&&(
                  <div>
                    <div style={{fontSize:9,color:'#334155',fontWeight:700,letterSpacing:'.06em',marginBottom:5}}>SUCCESSORS ({succs.length})</div>
                    {succs.map(s=>{ const sp=progress[s.id]??0; return (
                      <div key={s.id} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}>
                        <div style={{width:5,height:5,borderRadius:'50%',background:s.trackable?pctColor(sp):'#334155',flexShrink:0}}/>
                        <span style={{fontSize:10,color:'#94a3b8',flex:1}}>{s.name}</span>
                        {s.trackable&&<span style={{fontSize:9,color:pctColor(sp),fontWeight:700}}>{sp}%</span>}
                      </div>
                    );})}
                  </div>
                )}
              </>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// Convert hex to rgb for rgba
function hexToRgb(hex) {
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r?`${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}`:null;
}

  const [progress, setProgress] = useState(load);
  const [view, setView] = useState('network');

  function onSet(id, pct) {
    setProgress(prev=>{const next={...prev,[id]:pct};save(next);return next;});
  }

  const total = ALL_TRACKABLE.length;
  const complete = ALL_TRACKABLE.filter(i=>(progress[i.id]??0)===100).length;
  const inProg = ALL_TRACKABLE.filter(i=>{const p=progress[i.id]??0;return p>0&&p<100;}).length;
  const avg = Math.round(ALL_TRACKABLE.reduce((s,i)=>s+(progress[i.id]??0),0)/total);

  const DEADLINE = new Date('2026-06-01T21:00:00+10:00');

            </div>

              ))}

          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            {[
              {label:'Overall',val:`${avg}%`,color:avg>=75?'#4ade80':avg>=40?'#fbbf24':'#e94560'},
              {label:'Complete',val:`${complete}/${total}`,color:'#4ade80'},
              {label:'In Prog',val:inProg,color:'#fbbf24'},
              {label:`${days}d ${hours}h`,val:'to deadline',color:days<=2?'#e94560':days<=5?'#fbbf24':'#4ade80'},
            ].map(s=>(
              <div key={s.label} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)',borderRadius:8,padding:'5px 12px',textAlign:'center'}}>
                <div style={{fontSize:14,fontWeight:700,color:s.color}}>{s.val}</div>
                <div style={{fontSize:8,color:'#334155'}}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:3,borderRadius:2,background:'rgba(255,255,255,.04)',overflow:'hidden',marginTop:8}}>
          <div style={{height:'100%',width:`${avg}%`,background:'linear-gradient(90deg,#e94560,#f59e0b,#4ade80)',transition:'width .4s'}}/>
        </div>
      </header>

      {/* View */}
      {view==='network'
        ? <NetworkView progress={progress} onSet={onSet} />
        : <FlowchartView progress={progress} onSet={onSet} />
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
